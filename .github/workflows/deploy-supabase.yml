name: Deploy server program to Supabase

# Runs when the server code changes, or by hand (Actions → this workflow → Run workflow).
on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch:

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: ezsqpmlmtrmovnikmxrs   # Supabase project wap-cpd-test (now serving LIVE data)
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Check the Supabase access token is saved
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "The SUPABASE_ACCESS_TOKEN secret is not saved yet (Settings → Secrets and variables → Actions). Skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ready == 'true'
        with:
          version: latest
      - name: Deploy the server program
        if: steps.check.outputs.ready == 'true'
        run: supabase functions deploy cpd --project-ref "$PROJECT_REF" --no-verify-jwt
      - name: Check it answers
        if: steps.check.outputs.ready == 'true'
        run: |
          sleep 5
          curl -sS --fail-with-body -X POST "https://$PROJECT_REF.supabase.co/functions/v1/cpd" \
            -H 'Content-Type: application/json' \
            -H 'apikey: sb_publishable_pyqhJtDNu1ZzSgYLTokh5A_1velMgFW' \
            -d '{"op":"view"}' > reply.json
          head -c 300 reply.json; echo
          grep -q '"ok":true' reply.json
          grep -q '"dataset":"live"' reply.json && echo "Live data is being served." 
